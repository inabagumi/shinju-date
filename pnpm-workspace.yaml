packages:
  - apps/*
  - packages/*

allowBuilds:
  "@sentry-internal/node-cpu-profiler": true
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": true
  esbuild: true
  msw: true
  sharp: true
  supabase: true

catalog:
  "@googleapis/youtube": 40.1.0
  "@playwright/test": 1.65.1
  "@radix-ui/react-popover": 1.3.1
  "@radix-ui/react-slot": 1.5.0
  "@sentry/nextjs": 11.18.0
  "@sentry/profiling-node": 11.18.0
  "@supabase/sentry-js-integration": 0.3.0
  "@supabase/supabase-js": 2.119.2
  "@tailwindcss/turbopack": 4.3.5
  "@tailwindcss/typography": 0.5.20
  "@testing-library/jest-dom": 8.0.0
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.13
  "@types/node": 26.6.11
  "@types/react": 19.3.1
  "@types/react-dom": 19.3.0
  "@upstash/redis": 1.41.1
  "@vitejs/plugin-react": 6.3.0
  babel-plugin-react-compiler: 1.0.0
  jsdom: 31.0.1
  lucide-react: 1.80.0
  msw: 3.0.8
  next: 16.4.6
  oxlint: 1.95.0
  react: 19.3.1
  react-dom: 19.3.1
  react-markdown: 10.1.0
  rehype-external-links: 3.0.0
  remark-gfm: 4.0.1
  sharp: 0.35.5
  tailwindcss: 4.3.5
  temporal-polyfill: 1.0.8
  tsdown: 0.23.7
  typescript: 6.0.3
  vite: 8.3.8
  vitest: 5.1.1
  zod: 4.6.7

overrides:
  # GHSA-3g3m-2fjr-6pw4、GHSA-g3hv-75wg-m249: @storybook/react-vite が依存する 0.7 系は glob 13 を使う
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": 14.0.6
  # GHSA-rj75-hqrm-r3gf: @tailwindcss/typography は postcss-selector-parser 6.0.10 に固定している
  "@tailwindcss/typography>postcss-selector-parser": 6.1.6

permissions:
  tsdown:
    skills: false
  ultracite:
    skills: false

publicHoistPattern:
  - "*import-in-the-middle*"
  - "*require-in-the-middle*"

savePrefix: ""

strictPeerDependencies: false
