name: Supabase DB Push on main

on:
  push:
    branches:
      - main

jobs:
  supabase-db-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: Run supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # Supabase CLI v3 targets the local stack by default and requires
          # explicit consent for changes to a hosted project in CI.
          pnpm exec supabase db push --remote --yes
