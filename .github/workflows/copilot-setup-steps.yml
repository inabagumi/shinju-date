name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CJK fonts and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk postgresql-client

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: Build internal packages to generate type definitions
        run: pnpm typegen

      - name: Set Next.js Turbopack TLS environment variable
        run: echo 'NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS=1' >> $GITHUB_ENV

      - name: Start Supabase
        run: pnpm exec supabase start

      - name: Start Redis
        run: docker compose up -d --wait

      - name: Set environment variables for Supabase and Upstash
        run: |
          # `supabase status -o env` prints the values as NAME="value" lines
          status="$(pnpm exec supabase status -o env)"
          eval "$(grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' <<< "$status")"

          # The Redis HTTP API of compose.yml accepts this token
          redis_token="$(sed -n 's/^SRH_TOKEN=//p' config/dev-secrets.env)"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL:?}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:?}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:?}"
            echo "UPSTASH_REDIS_REST_TOKEN=${redis_token:?}"
            echo "UPSTASH_REDIS_REST_URL=http://localhost:8079"
          } >> "$GITHUB_ENV"

      - name: Verify Supabase and Redis
        run: |
          # The migrations and the seed are applied: a seeded table has a row
          curl --fail --silent --show-error \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/talents?select=id&limit=1" \
            | jq --exit-status 'length > 0'

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '["PING"]' \
            "${UPSTASH_REDIS_REST_URL}" \
            | jq --exit-status '.result == "PONG"'
