name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - apps/*/.env.local.sample
      - compose.yml
      - config/dev-secrets.env
      - scripts/lib.sh
      - scripts/setup-dev.sh
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - apps/*/.env.local.sample
      - compose.yml
      - config/dev-secrets.env
      - scripts/lib.sh
      - scripts/setup-dev.sh

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CJK fonts and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk postgresql-client

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: Set Next.js Turbopack TLS environment variable
        run: echo 'NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS=1' >> $GITHUB_ENV

      # Starts Supabase and Redis, creates the .env.local files and generates the types
      - name: Set up the development environment
        run: pnpm run setup

      - name: Verify Supabase and Redis
        run: |
          # The setup script wrote the URLs, the keys and the token to .env.local
          set -a
          source apps/admin/.env.local
          set +a

          # The migrations and the seed are applied: a seeded table has a row
          curl --fail --silent --show-error \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/talents?select=id&limit=1" \
            | jq --exit-status 'length > 0'

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '["PING"]' \
            "${UPSTASH_REDIS_REST_URL}" \
            | jq --exit-status '.result == "PONG"'

      - name: Verify that the setup can run again
        run: |
          # A second run succeeds and keeps the existing .env.local files
          echo '# Added by the workflow' >> apps/web/.env.local
          pnpm run setup
          grep -qxF '# Added by the workflow' apps/web/.env.local
