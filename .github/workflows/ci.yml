name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  # Install dependencies job (shared cache for all Node.js jobs)
  install:
    name: Install Dependencies
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

  # Detect whether the database job needs to run
  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      database: ${{ steps.filter.outputs.database }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect database changes
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # A pull request checks out the merge commit, whose first parent is the base branch
            base="HEAD^1"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git fetch --depth=1 origin "$BEFORE_SHA"; then
            base="$BEFORE_SHA"
          else
            base=""
          fi

          if [ -z "$base" ]; then
            echo "Could not find the base commit, so the database job runs"
            database=true
          else
            changed_files=$(git diff --name-only "$base" HEAD)
            # The Supabase CLI version is in package.json, and it can change the generated types
            if grep -qE '^(supabase/|packages/database/|scripts/generate-types\.sh$|package\.json$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
              database=true
            else
              database=false
            fi
          fi

          echo "database=$database"
          echo "database=$database" >> "$GITHUB_OUTPUT"

  # Matrix job for all unit tests (Node.js packages)
  test:
    name: Test (${{ matrix.package.name }})
    runs-on: ubuntu-26.04
    needs: install
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          # Node.js packages with tests (excluding UI browser tests)
          - name: "@shinju-date/database"
            language: "node"
          - name: "@shinju-date/health-checkers"
            language: "node"
          - name: "@shinju-date/helpers"
            language: "node"
          - name: "@shinju-date/logger"
            language: "node"
          - name: "@shinju-date/msw-handlers"
            language: "node"
          - name: "@shinju-date/retryable-fetch"
            language: "node"
          - name: "@shinju-date/temporal-fns"
            language: "node"
          - name: "@shinju-date/ui"
            language: "node"
          - name: "@shinju-date/scraper"
            language: "node"
          - name: "@shinju-date/twitch-api-client"
            language: "node"
          - name: "@shinju-date/video-backfill"
            language: "node"
          - name: "@shinju-date/web-cache"
            language: "node"
          - name: "@shinju-date/youtube-api-client"
            language: "node"
          # Node.js apps with unit tests
          - name: "@shinju-date/admin"
            language: "node"
          - name: "@shinju-date/batch"
            language: "node"
          - name: "@shinju-date/web"
            language: "node"
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup pnpm
        if: matrix.package.language == 'node'
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      # Node.js test execution
      - name: Run Node.js tests
        if: matrix.package.language == 'node'
        run: pnpm test --filter ${{ matrix.package.name }} -- --reporter=github-actions

  # Lint job for Node.js
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    needs: install
    permissions:
      contents: read
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Node.js linting
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: Run Node.js lint
        run: pnpm biome ci --reporter=github .

      # Checks the repository paths in Markdown files (external URLs are not checked)
      - name: Check docs
        run: pnpm run check:docs

  # Type check job for Node.js (including test files, which Vitest does not type check)
  typecheck:
    name: Typecheck
    runs-on: ubuntu-26.04
    needs: install
    permissions:
      contents: read
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: Run type check
        run: pnpm typecheck

  # Build job for Node.js
  build:
    name: Build (Node.js)
    runs-on: ubuntu-26.04
    needs: install
    permissions:
      contents: read
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - run: pnpm build --filter=!@shinju-date/admin --filter=!@shinju-date/batch --filter=!@shinju-date/web

  # Production build of Next.js apps with MSW (no live Supabase/Upstash needed)
  build-msw:
    name: Build with MSW (${{ matrix.package }})
    runs-on: ubuntu-26.04
    needs: install
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@shinju-date/web"
          - "@shinju-date/admin"
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: Build dependencies
        run: pnpm build --filter=${{ matrix.package }}^...

      - name: Build app with MSW
        run: pnpm --filter ${{ matrix.package }} build:msw
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fake
          NEXT_PUBLIC_SUPABASE_URL: https://fake.supabase.test
          NEXT_TELEMETRY_DISABLED: "1"
          SUPABASE_SERVICE_ROLE_KEY: fake
          UPSTASH_REDIS_REST_TOKEN: fake
          UPSTASH_REDIS_REST_URL: https://fake.upstash.test

  # E2E tests (including UI browser tests)
  e2e:
    name: E2E Tests (${{ matrix.package }})
    runs-on: ubuntu-26.04
    needs: [test, build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@shinju-date/web"
          - "@shinju-date/admin"
          - "@shinju-date/batch"
          - "@shinju-date/ui"
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      # Build dependencies for apps only
      - name: Build dependencies
        if: matrix.package != '@shinju-date/ui'
        run: |
          pnpm build --filter=@shinju-date/msw-handlers
          pnpm build --filter=${{ matrix.package }}^...

      # Get Playwright version
      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm --filter ${{ matrix.package }} exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version for ${{ matrix.package }}: $PLAYWRIGHT_VERSION"

      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-e2e-${{ matrix.package }}-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}

      # Install Playwright browsers
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ${{ matrix.package }} exec playwright install --with-deps chromium

      # Run E2E tests
      - name: Run E2E tests
        run: pnpm --filter ${{ matrix.package }} test:e2e
        env:
          CI: true

      # Sanitize package name for artifact
      - name: Sanitize package name for artifact
        id: sanitize
        run: |
          SANITIZED_NAME=$(echo "${{ matrix.package }}" | sed 's/[\/@]/_/g')
          echo "name=$SANITIZED_NAME" >> $GITHUB_OUTPUT
          echo "Sanitized artifact name: $SANITIZED_NAME"

      # Upload Playwright Report
      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ steps.sanitize.outputs.name }}
          path: |
            apps/*/playwright-report/
            packages/*/playwright-report/
          retention-days: 30

  # Migrations, pgTAP tests and generated types (only when the database changes)
  database:
    name: Database
    runs-on: ubuntu-26.04
    needs: [install, changes]
    if: needs.changes.outputs.database == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      # Applies all migrations and the seed to an empty database
      - name: Start local database
        run: pnpm exec supabase db start

      - name: Run pgTAP tests
        run: pnpm exec supabase test db

      - name: Check generated types are up to date
        run: |
          pnpm db:schema

          if ! git diff --exit-code packages/database/types/supabase.ts; then
            echo "::error file=packages/database/types/supabase.ts::The generated types do not match the migrations. Run \`pnpm db:schema\` and commit the result."
            exit 1
          fi

  # Summary job - this is the only required status check
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-26.04
    needs: [lint, typecheck, build-msw, e2e, changes, database]
    if: always()
    steps:
      - name: Check lint results
        if: needs.lint.result != 'success'
        run: |
          echo "Lint job failed"
          exit 1

      - name: Check typecheck results
        if: needs.typecheck.result != 'success'
        run: |
          echo "Typecheck job failed"
          exit 1

      - name: Check MSW build results
        if: needs.build-msw.result != 'success'
        run: |
          echo "MSW build job failed"
          exit 1

      - name: Check E2E results
        if: needs.e2e.result != 'success'
        run: |
          echo "E2E job failed"
          exit 1

      # The database job is skipped when the database does not change
      - name: Check database results
        if: needs.changes.result != 'success' || (needs.database.result != 'success' && needs.database.result != 'skipped')
        run: |
          echo "Database job failed"
          exit 1

      - name: All jobs passed
        run: echo "All jobs passed successfully!"
