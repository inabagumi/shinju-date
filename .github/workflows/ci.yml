name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # The merge queue runs CI on main with the pull requests ahead in the queue
  merge_group:

# A new push to a pull request cancels the older run; pushes to main and merge groups run to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether the database and Terraform jobs need to run
  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      database: ${{ steps.filter.outputs.database }}
      terraform: ${{ steps.filter.outputs.terraform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect database and Terraform changes
        id: filter
        env:
          # A merge group has no before, so it compares with main at the time
          # the group was made (this includes the pull requests ahead in the queue)
          BEFORE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # A pull request checks out the merge commit, whose first parent is the base branch
            base="HEAD^1"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git fetch --depth=1 origin "$BEFORE_SHA"; then
            base="$BEFORE_SHA"
          else
            base=""
          fi

          if [ -z "$base" ]; then
            echo "Could not find the base commit, so the database and Terraform jobs run"
            database=true
            terraform=true
          else
            changed_files=$(git diff --name-only "$base" HEAD)
            # The Supabase CLI version is in package.json, and it can change the generated types
            if grep -qE '^(supabase/|packages/database/|scripts/(generate-types|lib)\.sh$|package\.json$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
              database=true
            else
              database=false
            fi

            if grep -qE '^(terraform/|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
              terraform=true
            else
              terraform=false
            fi
          fi

          echo "database=$database"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "terraform=$terraform"
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"

  # Unit tests of all packages (turbo skips the packages whose inputs did not change)
  test:
    name: Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    # Redis and its Upstash compatible REST API, as in compose.yml, for the
    # tests of @shinju-date/video-backfill that run its Lua scripts on Redis
    services:
      redis:
        image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
      serverless-redis-http:
        image: hiett/serverless-redis-http:0.0.10@sha256:65128347949bca511e448fd7238780d624573d74c22b79155a7563db19e9b678
        env:
          SRH_CONNECTION_STRING: redis://redis:6379
          SRH_MODE: env
          SRH_TOKEN: ci-token
        ports:
          - 8079:80
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:80/" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm test -- --reporter=github-actions
        env:
          UPSTASH_REDIS_REST_TOKEN: ci-token
          UPSTASH_REDIS_REST_URL: http://localhost:8079

  # Lint job for Node.js
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      # Runs Stylelint, oxfmt and oxlint. oxlint reports to the lines of the pull request
      - name: Run Node.js lint
        run: pnpm run check --format=github

      # Checks the blank lines after the cache directives, which oxlint does not check yet
      - name: Check cache directives
        run: pnpm run check:cache-directives

      # Tests the check scripts (the oxlint rules in packages/oxlint-plugin/ are tested in the test job)
      - name: Test scripts
        run: pnpm run test:scripts

      # Checks the repository paths in Markdown files (external URLs are not checked)
      - name: Check docs
        run: pnpm run check:docs

      # Checks that the apps send the token that the local Redis HTTP API accepts
      - name: Check dev secrets
        run: pnpm run check:dev-secrets

  # Type check job for Node.js (including test files, which Vitest does not type check)
  typecheck:
    name: Typecheck
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: Run type check
        run: pnpm typecheck

  # Build job for Node.js
  build:
    name: Build (Node.js)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - run: pnpm build --filter=!@shinju-date/admin --filter=!@shinju-date/batch --filter=!@shinju-date/web

      # Checks the shape of `exports` in packages/*/package.json and that the built files it points to exist
      - name: Check package exports
        run: pnpm run check:package-exports

  # Production build of Next.js apps with MSW (no live Supabase/Upstash needed)
  build-msw:
    name: Build with MSW (${{ matrix.package }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@shinju-date/web"
          - "@shinju-date/admin"
          - "@shinju-date/batch"
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: Build dependencies
        run: pnpm build --filter=${{ matrix.package }}^...

      - name: Build app with MSW
        run: pnpm --filter ${{ matrix.package }} build:msw
        env:
          GOOGLE_API_KEY: fake
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fake
          NEXT_PUBLIC_SUPABASE_URL: https://fake.supabase.test
          NEXT_TELEMETRY_DISABLED: "1"
          SUPABASE_SERVICE_ROLE_KEY: fake
          UPSTASH_REDIS_REST_TOKEN: fake
          UPSTASH_REDIS_REST_URL: https://fake.upstash.test

  # E2E tests (including UI browser tests)
  e2e:
    name: E2E Tests (${{ matrix.package }})
    runs-on: ubuntu-26.04
    needs: [test, build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@shinju-date/web"
          - "@shinju-date/admin"
          - "@shinju-date/batch"
          - "@shinju-date/ui"
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      # Sanitize package name for artifact. Runs first, so that the report
      # keeps the package name even when a later step (e.g. the tests) fails
      - name: Sanitize package name for artifact
        id: sanitize
        run: |
          SANITIZED_NAME=$(echo "${{ matrix.package }}" | sed 's/[\/@]/_/g')
          echo "name=$SANITIZED_NAME" >> $GITHUB_OUTPUT
          echo "Sanitized artifact name: $SANITIZED_NAME"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      # Get Playwright version
      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm --filter ${{ matrix.package }} exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version for ${{ matrix.package }}: $PLAYWRIGHT_VERSION"

      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-e2e-${{ matrix.package }}-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}

      # Install Playwright browsers
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ${{ matrix.package }} exec playwright install --with-deps chromium

      # Runs through turbo, which builds the dependencies first (dependsOn in turbo.json)
      - name: Run E2E tests
        run: pnpm test:e2e --filter=${{ matrix.package }}
        env:
          CI: true

      # Upload Playwright Report
      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ steps.sanitize.outputs.name }}
          path: |
            apps/*/playwright-report/
            packages/*/playwright-report/
          retention-days: 30

  # Migrations, pgTAP tests and generated types (only when the database changes)
  database:
    name: Database
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.database == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Applies all migrations and the seed to an empty database
      - name: Start local database
        run: pnpm exec supabase db start

      - name: Run pgTAP tests
        run: pnpm exec supabase test db

      - name: Check generated types are up to date
        run: |
          pnpm db:schema

          if ! git diff --exit-code packages/database/types/supabase.ts; then
            echo "::error file=packages/database/types/supabase.ts::The generated types do not match the migrations. Run \`pnpm db:schema\` and commit the result."
            exit 1
          fi

  # Format and validate the Terraform configuration (only when it changes)
  terraform:
    name: Terraform
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    permissions:
      contents: read
    env:
      # Uses the official image rather than a third-party setup action
      TERRAFORM_IMAGE: hashicorp/terraform:1.17.2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check format
        run: docker run --rm -v "$PWD/terraform:/workspace" -w /workspace "$TERRAFORM_IMAGE" fmt -check -recursive

      # Skips HCP Terraform, which needs a token, and only downloads the providers
      - name: Initialize
        run: docker run --rm -v "$PWD/terraform:/workspace" -w /workspace "$TERRAFORM_IMAGE" init -backend=false -input=false

      - name: Validate
        run: docker run --rm -v "$PWD/terraform:/workspace" -w /workspace "$TERRAFORM_IMAGE" validate

  # Summary job - this is the only required status check
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-26.04
    needs:
      [
        changes,
        test,
        lint,
        typecheck,
        build,
        build-msw,
        e2e,
        database,
        terraform,
      ]
    if: always()
    steps:
      # The database and Terraform jobs are skipped when they do not change
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"

          if [ "$FAILED" = "true" ]; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi

          echo "All jobs passed successfully!"
